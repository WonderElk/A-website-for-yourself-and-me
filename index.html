<!doctype html>
<html lang="en">
  <!--Website structure-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The common blog</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <!---Website Contents-->
  <body>
    <div class="container flex-container">
      <div class="intro">
        <h2 class="underline">The common blog</h2>
        <p>
          A shared space for authors to share thoughts and ideas.<br />
          To navigate to an authors page, press their card.
        </p>
        <div id="index-auth-area">
          <p id="index-signed-in-panel" style="display: none">
            Signed in as
            <strong><span id="index-signed-in-email"></span></strong>
            <button id="index-logout-btn" type="button">Sign out</button>
          </p>
          <p id="index-signed-out-panel">
            <a href="auth.html"><button type="button">Sign in</button></a>
          </p>
        </div>
      </div>

      <div id="dynamic-authors" style="display: contents;"></div>

      <a href="tree.jpg" class="image-card grow">
        <img src="img/tree.jpg" alt="Tree" />
      </a>
    </div>
  <script type="module" src="javascript/indexPageAuth.js"></script>
</html>
