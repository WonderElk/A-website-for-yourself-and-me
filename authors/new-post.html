<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New post</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .form-field {
        display: block;
        margin-bottom: 14px;
      }
      .form-field label {
        display: block;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .form-field input[type="text"],
      .form-field input[type="email"],
      .form-field input[type="password"],
      .form-field select,
      .form-field textarea {
        width: 100%;
        padding: 6px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #999;
      }
      .form-field textarea {
        resize: vertical;
      }
      button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 6px;
      }
      .status {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2 class="underline">New post</h2>

      <div id="login-section" style="display: none; margin-bottom: 24px">
        <p>You must sign in to create a post.</p>
        <form id="login-form">
          <div class="form-field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email" required />
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password" required />
          </div>
          <button type="submit">Sign in</button>
          <p style="margin-top: 10px">
            <a href="../reset-password.html">Forgot password?</a>
          </p>
          <p id="login-error" class="status" style="color: red"></p>
        </form>
      </div>

      <div id="profile-section" style="display: none; margin-bottom: 24px;">
        <h3 class="underline" id="profile-heading">Create your profile</h3>
        <p id="profile-intro-text">Before you can post, you must create an author profile.</p>
        <form id="profile-form">
          <div class="form-field">
            <label for="profile-username">Username</label>
            <input id="profile-username" type="text" name="username" required minlength="3" pattern="^[a-zA-Z0-9_]+$" title="Only alphanumeric characters and underscores are allowed" />
          </div>
          <div class="form-field">
            <label for="profile-bio">Biography</label>
            <textarea id="profile-bio" name="bio" rows="4" placeholder="Tell readers about yourself..."></textarea>
          </div>
          <div class="form-field">
            <label for="profile-image">Profile picture (optional)</label>
            <input id="profile-image" type="file" name="image" accept="image/*" />
          </div>
          <button type="submit" id="profile-submit-btn">Create profile</button>
          <button type="button" id="cancel-profile-btn" style="display: none; margin-left: 10px;">Cancel</button>
          <p id="profile-status" class="status"></p>
        </form>
      </div>

      <div id="post-section" style="display: none">
        <p>
          Logged in as <strong><span id="user-email"></span></strong>
          &nbsp;
          <a id="my-page-link" href="#" style="font-weight: bold; margin-left: 10px;">view your page</a>
          &nbsp;
          <button id="logout-btn" type="button">Log out</button>
        </p>

        <form id="post-form">
          <div class="form-field">
            <label for="post-title">Title</label>
            <input id="post-title" type="text" name="title" required />
          </div>
          <div class="form-field">
            <label for="post-topic">Topic</label>
            <select id="post-topic" name="topic">
              <option value="">(none)</option>
              <option value="motion">Motion</option>
              <option value="webdev">WebDev</option>
            </select>
          </div>
          <div class="form-field">
            <label for="post-subtopic">Subtopic</label>
            <input id="post-subtopic" type="text" name="subtopic" />
          </div>
          <div class="form-field">
            <label for="post-body">Body</label>
            <textarea id="post-body" name="body" rows="10"></textarea>
          </div>
          <div class="form-field">
            <label for="post-image">Image (optional)</label>
            <input id="post-image" type="file" name="image" accept="image/*" />
          </div>
          <button type="submit">Create post</button>
          <p id="post-status" class="status"></p>
        </form>
      </div>

      <p style="margin-top: 20px"><a id="back-link" href="../index.html">← Back to posts</a></p>
    </div>

    <script type="module" src="../javascript/newPost.js"></script>
  </body>
</html>
